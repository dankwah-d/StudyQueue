services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: studyqueue_test
      POSTGRES_USER: studyqueue_test
      POSTGRES_PASSWORD: studyqueue_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyqueue_test -d studyqueue_test"]
      interval: 2s
      timeout: 5s
      retries: 30
